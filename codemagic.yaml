workflows:
  news-india-time-debug:
    name: News India Time APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    scripts:
      - name: Download Gradle 8.9
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          curl -L --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          chmod +x gradle-8.9/bin/gradle

      - name: Set Android SDK path
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Build debug APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          ./gradle-8.9/bin/gradle \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      - name: Show APK location
        script: |
          find "$CM_BUILD_DIR/app/build/outputs/apk" -type f -name "*.apk" -print

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/logs/*.txt
